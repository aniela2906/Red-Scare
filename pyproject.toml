[project]
name = "red-scare"
version = "0.1.0"
description = "Shared experiment runner and solvers for the Red Scare! exercise (Algorithm Design, Autumn 2026)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "networkx>=3.1",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/runner",
    "src/none",
    "src/some",
    "src/many",
    "src/few",
    "src/alternate",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter wraps code; long user-facing message strings are left whole.
# RUF001-3: we use ✓ ✗ ⏱ in user-facing messages on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["runner", "none", "some", "many", "few", "alternate"]
